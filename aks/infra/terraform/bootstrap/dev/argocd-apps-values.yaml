applicationsets:
  platform:
    namespace: argocd

    goTemplate: true
    goTemplateOptions:
      - missingkey=error

    generators:
      - git:
          repoURL: https://github.com/DarrenChouCN/cloud-k8s-lab.git
          revision: main
          files:
            - path: aks/gitops/platform/*/config.yaml

    template:
      metadata:
        name: '{{ .name }}'

      spec:
        project: default

        destination:
          server: https://kubernetes.default.svc
          namespace: '{{ .namespace }}'

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

    templatePatch: |
      spec:
        sources:
          # Official component Helm chart
          - repoURL: '{{ .chart.repoURL }}'
            chart: '{{ .chart.name }}'
            targetRevision: '{{ .chart.version }}'
            helm:
              valueFiles:
                - '$values/{{ .valuesFile }}'

          # Git repository containing Helm values
          - repoURL: https://github.com/DarrenChouCN/cloud-k8s-lab.git
            targetRevision: main
            ref: values

      {{ if ne (dig "manifestsPath" "" .) "" }}
          # Optional additional Kubernetes manifests
          - repoURL: https://github.com/DarrenChouCN/cloud-k8s-lab.git
            targetRevision: main
            path: '{{ dig "manifestsPath" "" . }}'
      {{ end }}