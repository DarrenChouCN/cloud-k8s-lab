---
- name: Check whether control plane already exists
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >-
    kubeadm init
    --apiserver-advertise-address={{ private_ip }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  register: kubeadm_init_result
  when: not admin_conf.stat.exists
  changed_when: true

- name: Ensure .kube directory exists for remote admin user
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Copy admin kubeconfig to remote admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
    remote_src: true

- name: Download Calico manifest
  ansible.builtin.get_url:
    url: "{{ calico_manifest_url }}"
    dest: "{{ calico_manifest_local }}"
    mode: "0644"

- name: Set Calico default pool IPIP to Never for Azure
  ansible.builtin.replace:
    path: "{{ calico_manifest_local }}"
    regexp: '(- name: CALICO_IPV4POOL_IPIP\s+value: )"Always"'
    replace: '\1"Never"'

- name: Set Calico default pool VXLAN to Always for this Azure lab
  ansible.builtin.replace:
    path: "{{ calico_manifest_local }}"
    regexp: '(- name: CALICO_IPV4POOL_VXLAN\s+value: )"Never"'
    replace: '\1"Always"'

- name: Apply Calico manifest
  ansible.builtin.command: kubectl apply -f {{ calico_manifest_local }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Wait for calico-node daemonset to be ready
  ansible.builtin.command: kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Publish worker join command for other hosts
  ansible.builtin.set_fact:
    worker_join_command: "{{ join_command_raw.stdout }}"

- name: Wait for Kubernetes API to answer locally
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubectl_nodes
  retries: 20
  delay: 15
  until: kubectl_nodes.rc == 0
  changed_when: false
