fullnameOverride: external-dns

provider:
  name: azure

sources:
  - ingress

domainFilters:
  - aks.darrencloudlab.com

policy: upsert-only

registry: txt
txtOwnerId: aks-cloud-k8s-lab-dev-ause-01

serviceAccount:
  create: true
  name: external-dns
  labels:
    azure.workload.identity/use: "true"
  annotations:
    # Come from Terraform output: client-id -> Azure Managed Identity
    azure.workload.identity/client-id: "f9b5c74f-f0b4-49ac-baf5-bde388897846"

podLabels:
  azure.workload.identity/use: "true"

extraVolumes:
  - name: azure-config-file
    secret:
      secretName: external-dns-azure

extraVolumeMounts:
  - name: azure-config-file
    mountPath: /etc/kubernetes
    readOnly: true